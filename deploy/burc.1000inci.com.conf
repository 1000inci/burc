# nginx server block — burc.1000inci.com
# Mevcut vault./ses./transfer. alt alanlarıyla aynı kalıp: reverse proxy + Let's Encrypt.
#
# Kurulum:
#   sudo cp deploy/burc.1000inci.com.conf /etc/nginx/sites-available/burc.1000inci.com
#   sudo ln -s /etc/nginx/sites-available/burc.1000inci.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d burc.1000inci.com      # Let's Encrypt sertifikası
#
# Önkoşul: DNS'te burc.1000inci.com -> sunucu IP (A kaydı) eklenmiş olmalı.

server {
    listen 80;
    server_name burc.1000inci.com;

    # Statik dosyaları (flatpickr, logo) doğrudan nginx sunsun (hızlı)
    location /static/ {
        alias /opt/burc/static/;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8050;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# certbot çalıştırıldığında 443 / SSL bloğunu otomatik ekler ve 80'i yönlendirir.
